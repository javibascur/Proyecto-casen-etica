<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.65;
      color: #333333;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 50px 24px 70px 24px;
    }
    header.site-header {
      margin-bottom: 35px;
      padding-bottom: 22px;
      border-bottom: 1px solid #eaeaea;
    }
    header.site-header h1 {
      font-size: 2.35rem;
      font-weight: 700;
      color: #2368a2;
      margin: 0 0 10px 0;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }
    header.site-header p.subtitle {
      font-size: 1.15rem;
      color: #6a737d;
      margin: 0;
      font-weight: 400;
    }
    h2 {
      font-size: 1.55rem;
      font-weight: 600;
      color: #1b1f23;
      margin-top: 40px;
      margin-bottom: 16px;
      border-bottom: 1px solid #eaecef;
      padding-bottom: 8px;
    }
    h3 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #24292e;
      margin-top: 26px;
      margin-bottom: 12px;
    }
    p, ul, ol {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.02rem;
      color: #3a3f47;
    }
    li {
      margin-bottom: 6px;
    }
    blockquote {
      margin: 20px 0;
      padding: 12px 20px;
      color: #4b525d;
      background-color: #f6f8fa;
      border-left: 4px solid #2368a2;
      border-radius: 4px;
    }
    blockquote p {
      margin: 0;
    }
    hr {
      height: 1px;
      background-color: #eaecef;
      border: none;
      margin: 36px 0;
    }
    a {
      color: #2368a2;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
      margin: 24px auto;
      border: 1px solid #eaecef;
    }
    code {
      font-family: Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.9em;
      background-color: #f6f8fa;
      padding: 2px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>{{ site.title }}</h1>
      <p class="subtitle">{{ site.description }}</p>
    </header>
    <main>
      {{ content }}
    </main>
  </div>
</body>
</html>
